name: MonoGS
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.3.1+cu121
    - torchvision==0.18.1+cu121
    - torchaudio==2.3.1+cu121
    - opencv-python-headless==4.8.1.78
    - setuptools
    - plyfile
    - tqdm
    - scipy
    - wandb
    - matplotlib
    - torchmetrics
    - open3d
    - imgviz
    - PyOpenGL
    - glfw
    - PyGLM
    - rich
    - fvcore
    - pytorch-msssim
    - "numpy<2"
    - setuptools
    - munch
    - trimesh
    - evo==1.11.0
    - lpips
    - ruff
